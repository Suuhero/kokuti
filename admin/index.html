<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&amp;family=Noto+Serif+JP:wght@400;500;600;700&amp;display=swap" />
    <title>kokuti｜告知サイト管理</title>
    <link rel="stylesheet" href="../assets/admin.css" />
    <link rel="stylesheet" href="../assets/dashicons.css" />
  </head>
  <body>
    <a class="skip" href="#editor">編集内容へ</a>
    <header class="topbar">
      <button
        id="menu-toggle"
        aria-label="メニューを開く"
        aria-expanded="false"
      >
        <span
          class="dashicons dashicons-menu"
          aria-hidden="true"
        ></span></button
      ><span id="clinic-label">告知サイト管理</span
      ><a href="../" target="_blank" rel="noopener"
        >サイトを表示 <span aria-hidden="true">↗</span></a
      >
    </header>
    <aside class="sidebar">
      <a class="brand" href="#home">kokuti<small>告知サイト管理</small></a>
      <nav id="nav" aria-label="管理メニュー"></nav>
      <div class="sidebar-bottom">
        GitHub Pages デモ<br /><span>ブラウザ内に保存 / v0.1</span>
      </div>
    </aside>
    <main id="main">
      <div class="page-heading">
        <div>
          <h1 id="page-title">読み込み中</h1>
          <p id="page-description"></p>
        </div>
        <div class="save-area">
          <span id="save-state" aria-live="polite"></span
          ><button id="save" class="primary" disabled>変更を保存</button>
        </div>
      </div>
      <div class="demo-notice">
        デモ環境：変更はこのブラウザ内だけに保存されます。
      </div>
      <div id="notice" role="status" aria-live="polite" hidden></div>
      <form id="editor" novalidate></form>
      <footer class="admin-footer">
        kokuti — 告知サイトテンプレート<span
          >サンプルの医院情報はすべて架空です。</span
        >
      </footer>
    </main>
    <dialog id="confirm">
      <form method="dialog">
        <h2 id="confirm-title"></h2>
        <p id="confirm-body"></p>
        <div class="dialog-actions">
          <button value="cancel">キャンセル</button
          ><button value="ok" class="primary" id="confirm-ok">実行する</button>
        </div>
      </form>
    </dialog>
    <noscript>管理画面の利用にはJavaScriptを有効にしてください。</noscript>
    <script type="module" src="../assets/admin.js?v=20261021"></script>
  </body>
</html>
